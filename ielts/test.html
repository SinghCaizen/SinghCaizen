<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Media Diagnostic — IELTS Study</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>body{font-family:monospace;padding:1rem;line-height:1.7} .ok{color:green} .bad{color:red}</style>
</head>
<body>
<h1>Media diagnostic results</h1>
<div id="log"></div>
<audio id="a1" controls preload="metadata"></audio>
<script>
var log = document.getElementById('log');
function say(id, txt, ok) {
  var p = document.createElement('p');
  p.id = id;
  p.innerHTML = txt;
  p.className = ok === true ? 'ok' : ok === false ? 'bad' : '';
  log.appendChild(p);
}
var PDF_ID = '1GyAou2NBZWE2br-8uK4MQpngHoqdUgDB';   // IELTS Bar and Line Graph (254 KB)
var AUD_ID = '1CjdAclThqxdnyirw512ux8qVsbLFxqgJ';   // Test 1 MP3 (25 MB)
function dl(id) { return 'https://drive.usercontent.google.com/download?id=' + id + '&export=download'; }

say('t0', 'START ' + new Date().toISOString());

/* TEST A: fetch the PDF bytes (CORS check) */
fetch(dl(PDF_ID)).then(function (r) {
  return r.arrayBuffer().then(function (buf) {
    var head = String.fromCharCode.apply(null, new Uint8Array(buf.slice(0, 4)));
    say('tA', 'TEST A fetch PDF: status=' + r.status + ' bytes=' + buf.byteLength + ' head=' + head, head === '%PDF');
    /* TEST C2: PDF.js from ArrayBuffer */
    pdfjsLib.getDocument({ data: buf }).promise.then(function (doc) {
      say('tC2', 'TEST C2 PDF.js from buffer: PAGES=' + doc.numPages, true);
    }).catch(function (e) { say('tC2', 'TEST C2 PDF.js from buffer FAILED: ' + e.name + ' ' + e.message, false); });
  });
}).catch(function (e) { say('tA', 'TEST A fetch PDF FAILED: ' + e.message, false); });

/* TEST C: PDF.js directly from URL */
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  pdfjsLib.getDocument({ url: dl(PDF_ID), withCredentials: false }).promise.then(function (doc) {
    say('tC', 'TEST C PDF.js from URL: PAGES=' + doc.numPages, true);
  }).catch(function (e) { say('tC', 'TEST C PDF.js from URL FAILED: ' + e.name + ' ' + e.message, false); });
} else {
  say('tC', 'TEST C: pdfjsLib NOT LOADED (cdnjs blocked?)', false);
}

/* TEST B: audio element with direct src */
var a = document.getElementById('a1');
a.src = dl(AUD_ID);
setTimeout(function () {
  var err = a.error ? (' code=' + a.error.code + ' msg=' + a.error.message) : '';
  say('tB', 'TEST B audio element: readyState=' + a.readyState + ' networkState=' + a.networkState +
      ' duration=' + a.duration + err, a.readyState >= 2);
}, 12000);

/* TEST D: fetch audio with Range */
fetch(dl(AUD_ID), { headers: { Range: 'bytes=0-1000' } }).then(function (r) {
  say('tD', 'TEST D fetch audio range: status=' + r.status + ' type=' + r.headers.get('content-type'), r.status === 206 || r.status === 200);
}).catch(function (e) { say('tD', 'TEST D fetch audio FAILED: ' + e.message, false); });

setTimeout(function () { say('tZ', 'END OF TESTS'); }, 15000);
</script>
</body>
</html>

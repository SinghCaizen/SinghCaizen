<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart aur Order — SonaKhet | A Singh Caizen Product</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23234527'/><text x='50' y='66' font-size='46' text-anchor='middle' fill='%23d9a441' font-family='Georgia'>S</text></svg>">
</head>
<body data-page="cart">
<div id="hdr"></div>
<div class="wrap" id="cartarea">
  <div class="phead"><div class="kick">Aapka Order</div><h1>Cart</h1><p>Kilo ke hisab se Kilo Bachat apne aap lagti hai — jitna zyada kilo, utni zyada bachat.</p></div>
  <div class="cartwrap">
    <div>
      <div id="cartlist"></div>
      <div class="sumbox" style="position:static;margin-top:20px">
        <h3>Delivery ki Jankari</h3>
        <form id="coform">
          <div class="f2">
            <div class="fld"><label>Poora Naam *</label><input name="name" required placeholder="Aapka naam"></div>
            <div class="fld"><label>Mobile Number *</label><input name="phone" required inputmode="numeric" maxlength="13" placeholder="10 anko ka number"></div>
          </div>
          <div class="fld"><label>Poora Pata *</label><textarea name="address" required rows="2" placeholder="Makan no., gali, gaon/shahar"></textarea></div>
          <div class="f2">
            <div class="fld"><label>PIN Code *</label><input name="pin" required inputmode="numeric" maxlength="6" placeholder="6 anko ka PIN"></div>
            <div class="fld"><label>Payment</label><input value="Cash on Delivery / UPI" disabled></div>
          </div>
          <button class="btn green big" type="submit" style="width:100%;justify-content:center">Order Pakka Karein</button>
          <p style="font-size:13px;color:var(--mut);margin-top:10px;text-align:center">Order karte hi hum phone par pushti karenge. Paisa delivery ke samay hi dena hai.</p>
        </form>
      </div>
    </div>
    <div class="sumbox" id="cartsum"></div>
  </div>
</div>
<div id="ftr"></div>
<script src="js/app.js?v=1"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Sign Up — SonaKhet | A Singh Caizen Product</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23234527'/><text x='50' y='66' font-size='46' text-anchor='middle' fill='%23d9a441' font-family='Georgia'>S</text></svg>">
</head>
<body data-page="auth">
<div id="hdr"></div>
<div class="wrap"><div class="authwrap"><div class="authcard">
  <h1>Swagat hai</h1>
  <p class="sub">Account banayein — orders, lot jaanch aur agle order ki aasani ke liye.</p>
  <div class="tabs"><button id="tab-login" class="on" type="button">Login</button><button id="tab-signup" type="button">Sign Up</button></div>
  <div class="msg" id="amsg"></div>
  <form id="flogin">
    <div class="fld"><label>Email</label><input name="email" type="email" required placeholder="aapka@email.com"></div>
    <div class="fld"><label>Password</label><input name="pass" type="password" required placeholder="••••••••"></div>
    <button class="btn green big" type="submit" style="width:100%;justify-content:center">Login Karein</button>
  </form>
  <form id="fsignup" style="display:none">
    <div class="fld"><label>Poora Naam</label><input name="name" required placeholder="Aapka naam"></div>
    <div class="fld"><label>Email</label><input name="email" type="email" required placeholder="aapka@email.com"></div>
    <div class="fld"><label>Mobile Number</label><input name="phone" required inputmode="numeric" maxlength="13" placeholder="10 anko ka number"></div>
    <div class="fld"><label>Password Banayein</label><input name="pass" type="password" required minlength="6" placeholder="Kam se kam 6 akshar"></div>
    <button class="btn green big" type="submit" style="width:100%;justify-content:center">Account Banayein</button>
  </form>
</div></div></div>
<div id="ftr"></div>
<script src="js/app.js?v=1"></script>
</body>
</html>

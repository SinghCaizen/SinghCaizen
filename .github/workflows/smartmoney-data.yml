# Smart Money data pipeline — Folio (SinghCaizen/SinghCaizen)
#
# Two jobs, one file:
#   daily   — NAV/houses (AMFI), bhav-lite (BSE), NSDL monthly FII check
#   monthly — per-AMC portfolio adapters -> mf/ files + snapshots
# Both write ONLY under portfolio/data/smartmoney/ on the `data` branch.
# The pipeline code lives on `main` under tools/smartmoney-pipeline/.
#
# Failure behaviour (by design): a failed fetch never overwrites a good
# file; the run still commits the regenerated manifest (which marks the
# dataset stale/unavailable), and only then fails the job so the problem
# is visible in the Actions tab.

name: Smart Money data pipeline

on:
  schedule:
    # Daily: 13:35 UTC Mon-Fri = 19:05 IST, after AMFI publishes NAVs.
    - cron: "35 13 * * 1-5"
    # Monthly: 03:20 UTC on days 8-12 (AMCs publish month-end portfolios
    # within 10 days of month-end, per SEBI).
    - cron: "20 3 8-12 * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options: [all, daily, monthly]
        default: all
      month:
        description: "Monthly job month override (YYYY-MM, optional)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: smartmoney-data
  cancel-in-progress: false

jobs:
  daily:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.job == 'all' || inputs.job == 'daily') ||
      (github.event.schedule == '35 13 * * 1-5')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out main (pipeline code)
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Check out data branch (pipeline output)
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-out
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r tools/smartmoney-pipeline/requirements.txt
      - name: Run daily collectors
        id: pipeline
        continue-on-error: true
        run: >-
          python -m pipeline.runner
          --root data-out/portfolio/data/smartmoney
          --job daily
          --workdir ${{ runner.temp }}/smartmoney-work
        working-directory: tools/smartmoney-pipeline
      - name: Commit data to the data branch
        run: |
          cd data-out
          git config user.name "folio-smartmoney-bot"
          git config user.email "actions@github.com"
          git add portfolio/data/smartmoney
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "smartmoney daily: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:data
          fi
      - name: Fail the job if the pipeline reported failures
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "Pipeline marked at least one dataset stale/unavailable."
          echo "The manifest on the data branch carries the details."
          exit 1

  monthly:
    # Runs after daily within the same run so the two jobs never push to
    # the data branch at the same time; also runs when daily was skipped
    # (its own schedule) — hence always() + the result check.
    needs: daily
    if: >-
      always() &&
      (needs.daily.result == 'success' || needs.daily.result == 'skipped'
       || needs.daily.result == 'failure') &&
      ((github.event_name == 'workflow_dispatch' &&
        (inputs.job == 'all' || inputs.job == 'monthly')) ||
       (github.event.schedule == '20 3 8-12 * *'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out main (pipeline code)
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Check out data branch (pipeline output)
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-out
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r tools/smartmoney-pipeline/requirements.txt
      - name: Run monthly MF collectors
        id: pipeline
        continue-on-error: true
        run: >-
          python -m pipeline.runner
          --root data-out/portfolio/data/smartmoney
          --job monthly
          --workdir ${{ runner.temp }}/smartmoney-work
          ${{ inputs.month != '' && format('--month {0}', inputs.month) || '' }}
        working-directory: tools/smartmoney-pipeline
      - name: Commit data to the data branch
        run: |
          cd data-out
          git config user.name "folio-smartmoney-bot"
          git config user.email "actions@github.com"
          git add portfolio/data/smartmoney
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "smartmoney monthly MF: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:data
          fi
      - name: Fail the job if the pipeline reported failures
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "Pipeline marked at least one dataset stale/unavailable."
          echo "The manifest on the data branch carries the details."
          exit 1
